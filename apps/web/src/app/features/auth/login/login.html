<div class="min-h-screen flex items-center justify-center px-4 py-16">
  <mat-card class="w-full max-w-sm p-6! flex flex-col gap-5">
    <div class="flex flex-col gap-1">
      <h1 class="text-xl font-semibold">Log in to vaani</h1>
      <p class="text-sm text-ink-muted">
        One tap with Google — no password to remember, no email to verify.
      </p>
    </div>

    <button
      mat-flat-button
      color="primary"
      type="button"
      class="w-full!"
      [disabled]="loading()"
      (click)="continueWithGoogle()"
    >
      {{ loading() ? 'Opening Google…' : 'Continue with Google' }}
    </button>

    @if (error()) {
      <p class="text-sm text-danger" role="alert">{{ error() }}</p>
    }

    <p class="text-xs text-ink-muted">
      By continuing you agree to our
      <a routerLink="/terms" class="underline">Terms</a> and
      <a routerLink="/privacy" class="underline">Privacy Policy</a>.
    </p>
  </mat-card>
</div>
