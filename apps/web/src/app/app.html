<div [class]="themeClass()">
  @if (!hideChrome()) {
    <mat-toolbar class="border-b border-border! flex! items-center justify-between px-4! md:px-6!">
      <a routerLink="/" class="wordmark no-underline text-inherit!">{{ title() }}</a>

      <nav class="hidden md:flex items-center gap-6 text-sm">
        <a
          routerLink="/about"
          routerLinkActive="nav-link-active"
          class="nav-link no-underline text-inherit!"
          >About</a
        >
        <a
          routerLink="/pricing"
          routerLinkActive="nav-link-active"
          class="nav-link no-underline text-inherit!"
          >Pricing</a
        >
        <a
          routerLink="/contact"
          routerLinkActive="nav-link-active"
          class="nav-link no-underline text-inherit!"
          >Contact</a
        >
        @if (isAuthed()) {
          <a mat-flat-button color="primary" routerLink="/app" class="px-4! py-1!">Open vaani</a>
          <button
            mat-icon-button
            type="button"
            [matMenuTriggerFor]="userMenu"
            aria-label="Account"
            class="p-0! overflow-hidden!"
          >
            @if (userPhoto() && !photoFailed()) {
              <img
                [src]="userPhoto()"
                (error)="photoFailed.set(true)"
                alt=""
                class="w-8 h-8 rounded-full object-cover"
              />
            } @else {
              <mat-icon>account_circle</mat-icon>
            }
          </button>
          <mat-menu #userMenu="matMenu">
            <div class="px-4 py-2 text-sm text-ink-muted">{{ userLabel() }}</div>
            <a mat-menu-item routerLink="/app">Translate</a>
            <a mat-menu-item routerLink="/history">History</a>
            <button mat-menu-item type="button" (click)="logOut()">Log out</button>
          </mat-menu>
        } @else {
          <a mat-button routerLink="/login" class="px-4! py-1!">Log in</a>
          <a mat-flat-button color="primary" routerLink="/login" class="px-4! py-1!">Sign up</a>
        }
      </nav>

      <button
        mat-icon-button
        type="button"
        class="md:hidden!"
        [matMenuTriggerFor]="mobileMenu"
        aria-label="Open menu"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #mobileMenu="matMenu">
        <a mat-menu-item routerLink="/about">About</a>
        <a mat-menu-item routerLink="/pricing">Pricing</a>
        <a mat-menu-item routerLink="/contact">Contact</a>
        @if (isAuthed()) {
          <a mat-menu-item routerLink="/app">Open vaani</a>
          <a mat-menu-item routerLink="/history">History</a>
          <button mat-menu-item type="button" (click)="logOut()">Log out</button>
        } @else {
          <a mat-menu-item routerLink="/login">Log in / Sign up</a>
        }
      </mat-menu>
    </mat-toolbar>
  }

  <main>
    <router-outlet />
  </main>
</div>
